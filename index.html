<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styles.css" />
    <title>Veterinaria Patitas y Garritas</title>
  </head>
  <body>
    <header>
      <h1>Patitas y Garritas</h1>
      <p>"Reservá el turno de tu mascota online"</p>
    </header>
    <main>
        <form>
            <section>
                <h3>Tus datos</h3>
                  <label for="nombre">Nombre</label>
                  <input type="text", id="nombre", name="nombre", required />

                  <label for="email">Email</label>
                  <input type="email", id="email", name="email", required />

                  <label for="telefono">Teléfono</label>
                  <input type="text", id="telefono", name="telefono", required />
            </section>
            <section> 
              <h3>Datos de tu mascota</h3>
                <label for="mascota">Nombre de la mascota</label>
                <input
                type="text", id="mascota", name="mascota", required 
                />
              <label for="especie">Especie</label>
                <select id="especie" y name="especie", required>
                  <option value="Perro">Perro</option>
                  <option value="Gato">Gato</option>
                  <option value="Ave">Ave</option>
                  <option value="Conejo">Conejo</option>
                  <option value="Otro">Otro</option>
                <select/>
                <label for="peso">Peso aproximado (kg)</label>
                <input
                 type="number", id="peso", name="peso", min="0"
                />
            </section>
            <section>
              <h3>Motivo de la consulta</h3>
              <div>
                <label for="control">Control de rutina</label>
                <input
                type="radio"
                name="motivo"
                id="control"
                value="control"
                >
              </div>
              <div>
                <label for="option">Vacunación</label>
                <input 
                type="radio"
                name="motivo"
                id="vacuna"
                value="vacuna"
                />
              </div>
              <div>
                <label for="option">Enfermedad o síntoma</label>
                <input
                type="radio"
                name="motivo"
                id="enfermedad"
                value="enfermedad"
                />
              </div>
              <div>
                <label for="option">Otro</label>
                <input
                type="radio"
                name="motivo"
                id="otro"
                value="otro"
                />
              </div>
            </section>
            <section>
              <h3>Día preferido</h3>
              <div class="option">
                <label for="option">Lunes</label>
                <input
                 type="checkbox"
                 id="lunes"     
                 name="dia_lunes"     
                 value="lunes"
                 />
              </div>
              <div class="opcion-checkbox">
                <label for="option">Miércoles</label>
                <input
                  type="checkbox"
                  id="miercoles"
                  name="dia_miercoles"
                  value="miercoles" 
                 />
              </div>
              <div class="opcion-checkbox">
                <label for="option">Viernes</label>
                <input
                  type="checkbox"
                  id="viernes"   
                  name="dia_viernes"  
                  value="viernes"
                 />
              </div>
              <div class="opcion-checkbox">
                <label for="option">Sábado</label>
                <input
                 type="checkbox"
                 id="sabado"    
                 name="dia_sabado"    
                 value="sabado" 
                 />
              </div>
            </section>
            <section>
              <h3>Turno preferido</h3>
                <select id="horario", name="horario", required>
                    <option>-- Elegí un horario --</option>
                    <option> Mañana (9 a 13hs)</option>
                    <option> Tarde (14 a 18hs)</option>
                </select>
            </section>
            <section>
              <h3>Comentarios</h3>
                <textarea id="comentarios", name="comentarios", rows="4"></textarea>
            <label>"¿Querés contarnos algo más sobre tu mascota?"</label>
            </section>
            <p id="mensaje"></p>
            <button type="submit">Solicitar turno</button>
        </form>
    </main>
  </body>
  <footer>
    <p>Veterinaria Patitas y Garritas - Ariadna Alemán — Buenos Aires</p>
  </footer>
</html>
